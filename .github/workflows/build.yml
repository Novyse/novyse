name: Shared Build

# Central build matrix, called by release.yml (mode: release artifacts) and
# release-test.yml (mode: plain build check). Produces one `build-<os>`
# workflow artifact per OS (plus `web-dist` for the web deploy job).
on:
  workflow_call:
    inputs:
      os:
        description: Target OS to build (all or single)
        required: false
        default: all
        type: string
      ref:
        description: Branch or ref to checkout and build
        required: true
        type: string
    secrets:
      GOOGLE_SERVICES_JSON:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

jobs:
  build-android:
    if: ${{ inputs.os == 'all' || inputs.os == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Android
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/novyse-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci/ci-build.sh android

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: dist/
          if-no-files-found: warn

  build-linux:
    if: ${{ inputs.os == 'all' || inputs.os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config ninja-build libsecret-1-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libglib2.0-dev libwebkit2gtk-4.1-dev libpulse-dev libmpv-dev libepoxy-dev dpkg-dev rpm elfutils zip unzip rsync flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub \
            org.gnome.Platform//51 \
            org.gnome.Sdk//51 \
            org.freedesktop.Sdk.Extension.llvm22//26.08
          sudo snap set system refresh.hold="$(date --date='+60 days' +%Y-%m-%dT%H:%M:%SZ)" || true
          sudo snap install snapcraft --classic --channel=latest/stable || sudo snap refresh snapcraft --channel=latest/stable || true
          sudo snap wait system seed-loaded || true
          sudo snap install gnome-core26-sdk gnome-core26 mesa-2604 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build Linux
        run: bash scripts/ci/ci-build.sh linux

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/
          if-no-files-found: warn

  build-windows:
    if: ${{ inputs.os == 'all' || inputs.os == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Packaging Tools (Inno Setup & WiX Toolset)
        shell: pwsh
        run: |
          choco install innosetup wixtoolset zip --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows
        shell: bash
        run: bash scripts/ci/ci-build.sh windows

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: dist/
          if-no-files-found: warn

  build-macos:
    if: ${{ inputs.os == 'all' || inputs.os == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: macos-pods-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            macos-pods-

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: macos-spm-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            macos-spm-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            macos-cargo-

      - name: Setup Rust toolchain
        shell: bash
        run: |
          set -e
          rustup set default-host aarch64-apple-darwin
          rustup toolchain install stable-aarch64-apple-darwin --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable-aarch64-apple-darwin

      - name: Build macOS
        env:
          RUSTUP_TOOLCHAIN: stable-aarch64-apple-darwin
        run: bash scripts/ci/ci-build.sh macos

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/
          if-no-files-found: warn

  build-web:
    if: ${{ inputs.os == 'all' || inputs.os == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Web
        run: bash scripts/ci/ci-build.sh web

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: dist/
          if-no-files-found: warn

      - name: Upload web dist for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web/
          retention-days: 1
