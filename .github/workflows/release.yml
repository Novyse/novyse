name: Client Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Channel (production/preview)
        required: true
        type: choice
        options:
          - production
          - preview
      version:
        description: Version (e.g., 1.0.1-20260405.0)
        required: true
      patch_notes:
        description: Patchnotes (Markdown)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  git-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set Git user
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "bot@novyse.com"

      - name: Update Version in global.dart & pubspec
        run: |
          sed -i "s/const String appVersion = '[^']*';/const String appVersion = '${{ inputs.version }}';/g" lib/core/config/global.dart
          bash scripts/sync-version.sh
          bash scripts/sync-platform.sh
          git commit -am "chore: bump version to ${{ inputs.version }} and sync platform metadata" || true

      - name: Merge into target branch
        run: |
          git checkout ${{ inputs.release_type }}
          git merge development

      - name: Set Branch in global.dart
        run: |
          sed -i "s/const String branch = '[^']*';/const String branch = '${{ inputs.release_type }}';/g" lib/core/config/global.dart
          bash scripts/sync-platform.sh
          bash scripts/sync-branch.sh || true
          git commit -am "chore: set branch to ${{ inputs.release_type }}" || true

      - name: Push to GitHub
        run: |
          git push origin development
          git push origin ${{ inputs.release_type }}

  create-release:
    needs: git-flow
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Version ${{ inputs.version }}
          prerelease: ${{ inputs.release_type == 'preview' }}
          draft: true
          body: ${{ inputs.patch_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Decode Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > novyse-release.keystore
          fi

      - name: Install Dependencies & Sync
        run: |
          flutter pub get
          bash scripts/sync-licenses.sh
          bash scripts/sync-platform.sh

      - name: Build Android Release (Universal & Split APKs, AAB)
        run: |
          # 1. Build Universal APK
          flutter build apk --release

          # 2. Build Split-per-ABI APKs
          flutter build apk --release --split-per-abi

          # 3. Build Google Play Store App Bundle (production channel)
          if [ "${{ inputs.release_type }}" = "production" ]; then
            flutter build appbundle --release
          fi
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/novyse-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Export Public Signing Certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p dist
          if [ -f novyse-release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "🔑 Exporting public certificate (.pem)..."
            keytool -exportcert -rfc \
              -keystore novyse-release.keystore \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -file dist/novyse-release-cert.pem
          fi

      - name: Organize Android Artifacts
        run: |
          SUFFIX=""
          if [ "${{ inputs.release_type }}" = "preview" ]; then
            SUFFIX="-preview"
          fi

          mkdir -p dist

          # Copy and rename AAB
          find build/app/outputs/bundle -name "*.aab" | while read -r aab_path; do
            cp "$aab_path" "dist/novyse${SUFFIX}.aab"
          done

          # Copy and rename Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/novyse${SUFFIX}-universal.apk"
          fi

          # Copy and rename Split ABI APKs
          find build/app/outputs/flutter-apk -name "app-*-release.apk" | while read -r apk_path; do
            abi=$(basename "$apk_path" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$apk_path" "dist/novyse${SUFFIX}-${abi}.apk"
          done

      - name: Upload Android Artifacts to Release
        run: |
          for f in dist/*.aab dist/*.apk dist/*.pem; do
            if [ -f "$f" ]; then
              gh release upload v${{ inputs.version }} "$f" --clobber || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config ninja-build libsecret-1-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libglib2.0-dev libwebkit2gtk-4.1-dev libpulse-dev libmpv-dev libepoxy-dev dpkg-dev rpm elfutils zip unzip flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
          sudo snap install snapcraft --classic || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build & Package Linux
        run: |
          flutter pub get
          bash scripts/sync-licenses.sh
          bash scripts/build.sh linux

      - name: Upload Linux Artifacts
        run: |
          for f in dist/*.tar.gz dist/*.deb dist/*.AppImage dist/*.rpm dist/*.snap dist/*.flatpak; do
            if [ -f "$f" ]; then
              gh release upload v${{ inputs.version }} "$f" --clobber || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Packaging Tools (Inno Setup & WiX Toolset)
        shell: pwsh
        run: |
          choco install innosetup wixtoolset zip --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build & Package Windows
        shell: bash
        run: |
          flutter pub get
          bash scripts/sync-licenses.sh
          bash scripts/build.sh windows

      - name: Upload Windows Artifacts
        shell: bash
        run: |
          for f in dist/*.zip dist/*.exe dist/*.msi; do
            if [ -f "$f" ]; then
              gh release upload v${{ inputs.version }} "$f" --clobber || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build & Package macOS
        run: |
          flutter pub get
          bash scripts/sync-licenses.sh
          bash scripts/build.sh macos

      - name: Upload macOS Artifacts
        run: |
          for f in dist/*.dmg dist/*.zip; do
            if [ -f "$f" ]; then
              gh release upload v${{ inputs.version }} "$f" --clobber || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS Build (Currently Not Supported for Automated Releases)

  build-web:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build & Package Web
        run: |
          flutter pub get
          bash scripts/sync-licenses.sh
          bash scripts/build.sh web

      - name: Upload Web Build to GitHub Release
        run: |
          SUFFIX=""
          if [ "${{ inputs.release_type }}" = "preview" ]; then
            SUFFIX="-preview"
          fi
          gh release upload v${{ inputs.version }} "dist/novyse${SUFFIX}-web.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web Dist Artifact for Deploy Job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web/
          retention-days: 1

  publish-release:
    needs: [build-web, build-android, build-linux, build-windows, build-macos]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append Verification Table & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_NOTES: ${{ inputs.patch_notes }}
        run: |
          mkdir -p release-assets
          gh release download v${{ inputs.version }} --dir release-assets

          # Detect Android public cert fingerprint if present
          ANDROID_FINGERPRINT=""
          if [ -f release-assets/novyse-release-cert.pem ]; then
            ANDROID_FINGERPRINT=$(openssl x509 -in release-assets/novyse-release-cert.pem -noout -fingerprint -sha256 2>/dev/null | cut -d'=' -f2 || true)
          fi

          # Start release notes with original user patch notes
          printf "%s\n\n" "$PATCH_NOTES" > release-notes.md

          # Append verification section
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Integrity Checksums" >> release-notes.md
          echo "" >> release-notes.md
          echo "Below are the SHA-256 checksums to verify the authenticity and integrity of each file." >> release-notes.md
          echo "For detailed verification guides and platform instructions, see [BUILD.md](https://github.com/Novyse/novyse/blob/${{ inputs.release_type }}/BUILD.md#verifying-release-artifacts)." >> release-notes.md

          if [ -n "$ANDROID_FINGERPRINT" ]; then
            echo "" >> release-notes.md
            echo "> **Android Official Signing Certificate SHA-256:** \`$ANDROID_FINGERPRINT\`" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "| Platform | File | SHA-256 Checksum |" >> release-notes.md
          echo "| :--- | :--- | :--- |" >> release-notes.md

          # Append each binary asset to table
          find release-assets -maxdepth 1 -type f ! -name "*.txt" ! -name "*.md" | sort | while read -r filepath; do
            filename=$(basename "$filepath")
            hash=$(sha256sum "$filepath" | awk '{print $1}')

            platform="Other"
            case "$filename" in
              *.apk|*.aab|*.pem) platform="Android" ;;
              *.exe|*.msi) platform="Windows" ;;
              *.deb|*.rpm|*.AppImage|*.snap|*.flatpak|*.tar.gz) platform="Linux" ;;
              *.dmg) platform="macOS" ;;
              *windows*.zip) platform="Windows" ;;
              *macos*.zip|*mac*.zip) platform="macOS" ;;
              *web*.zip) platform="Web" ;;
            esac

            echo "| **$platform** | \`$filename\` | \`$hash\` |" >> release-notes.md
          done

          # Update release notes and publish release
          gh release edit v${{ inputs.version }} --notes-file release-notes.md --draft=false

  deploy-web:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: build/web/

      - name: Set Cloudflare Project
        id: cf-settings
        run: |
          if [[ "${{ inputs.release_type }}" == "production" ]]; then
            echo "project=novyse-web" >> $GITHUB_OUTPUT
          else
            echo "project=novyse-web-preview" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ steps.cf-settings.outputs.project }} --commit-dirty=true

  publish-flathub:
    needs: publish-release
    runs-on: ubuntu-latest
    if: ${{ inputs.release_type == 'production' }}
    steps:
      - name: Check Flathub Token
        id: check-token
        env:
          FLATHUB_DEPLOY_TOKEN: ${{ secrets.FLATHUB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$FLATHUB_DEPLOY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FLATHUB_DEPLOY_TOKEN secret is not set. Skipping Flathub deployment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Checkout Flathub Repository
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: flathub/com.novyse.desktop
          path: flathub-repo
          token: ${{ secrets.FLATHUB_DEPLOY_TOKEN }}

      - name: Generate Manifest and Copy Metadata
        if: steps.check-token.outputs.skip != 'true'
        run: |
          source scripts/extract-metadata.sh

          TARBALL="novyse.tar.gz"
          gh release download v${{ inputs.version }} -p "$TARBALL" || true
          if [ -f "$TARBALL" ]; then
            TARBALL_SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          else
            TARBALL_SHA256=""
          fi
          TARBALL_URL="https://github.com/Novyse/novyse/releases/download/v${{ inputs.version }}/$TARBALL"

          generate_desktop_entry "flathub-repo/${APP_ID}.desktop"
          generate_appstream_metainfo "flathub-repo/${APP_ID}.metainfo.xml"
          generate_linux_icons "flathub-repo/icons"
          generate_flathub_manifest "flathub-repo/${APP_ID}.yml" "$TARBALL_URL" "$TARBALL_SHA256"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push to Flathub
        if: steps.check-token.outputs.skip != 'true'
        run: |
          cd flathub-repo
          git config user.name "GitHub Action Bot"
          git config user.email "bot@novyse.com"
          git add .
          git commit -m "Update to version ${{ inputs.version }}" || exit 0
          git push origin master
