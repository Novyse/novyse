name: Client Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Channel (production/preview)
        required: true
        type: choice
        options:
          - production
          - preview
      version:
        description: Version (e.g., 1.0.1-20260405.0)
        required: true
      patch_notes:
        description: Patchnotes (Markdown)
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  git-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set Git user
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "bot@novyse.com"

      - name: Update Version in global.dart & pubspec
        run: |
          sed -i "s/const String appVersion = '[^']*';/const String appVersion = '${{ inputs.version }}';/g" lib/core/config/global.dart
          bash scripts/sync-version.sh
          bash scripts/sync-platform.sh
          git commit -am "chore: bump version to ${{ inputs.version }} and sync platform metadata" || true

      - name: Merge into target branch
        run: |
          git checkout ${{ inputs.release_type }}
          git merge development

      - name: Set Branch in global.dart
        run: |
          sed -i "s/const String branch = '[^']*';/const String branch = '${{ inputs.release_type }}';/g" lib/core/config/global.dart
          bash scripts/sync-platform.sh
          bash scripts/sync-branch.sh || true
          git commit -am "chore: set branch to ${{ inputs.release_type }}" || true

      - name: Push to GitHub
        run: |
          git push origin development
          git push origin ${{ inputs.release_type }}

  create-release:
    needs: git-flow
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Version ${{ inputs.version }}
          prerelease: ${{ inputs.release_type == 'preview' }}
          draft: true
          body: ${{ inputs.patch_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      os: all
      ref: ${{ inputs.release_type }}
      release_type: ${{ inputs.release_type }}
    secrets: inherit

  cleanup-release:
    needs: [create-release, build]
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release left behind by the failed build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed — deleting draft release v${{ inputs.version }}."
          gh release delete "v${{ inputs.version }}" --cleanup-tag --yes

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all dist artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist-upload
          merge-multiple: true

      - name: Upload to GitHub Release
        run: |
          mapfile -t files < <(find dist-upload -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No artifacts to upload."
            exit 0
          fi
          gh release upload "v${{ inputs.version }}" "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-updater:
    needs: upload-release
    if: ${{ inputs.release_type == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Download desktop update candidates
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist-upload
          merge-multiple: true

      - name: Restore desktop-update signing key
        env:
          DESKTOP_UPDATER_KEY_BUNDLE_BASE64: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_BASE64 }}
          DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE }}
        run: |
          if [ -z "$DESKTOP_UPDATER_KEY_BUNDLE_BASE64" ]; then
            echo "⚠️ DESKTOP_UPDATER_KEY_BUNDLE_BASE64 not set; skipping desktop feed."
            exit 0
          fi
          echo "$DESKTOP_UPDATER_KEY_BUNDLE_BASE64" | base64 --decode > /tmp/release-key.dukey
          flutter pub get
          dart run desktop_updater:release keys import \
            --input /tmp/release-key.dukey \
            --passphrase-env DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE
          shred -u /tmp/release-key.dukey || rm -f /tmp/release-key.dukey

      - name: Sign and upload desktop update files
        run: |
          shopt -s nullglob
          archive_file="dist-upload/desktop_updater/app-archive.json"
          for plat in windows linux macos; do
            for z in dist-upload/desktop_updater/$plat/*.zip; do
              [ -f "$z" ] || continue
              canon_zip="dist-upload/desktop_updater/$plat/novyse-$plat-${{ inputs.version }}.zip"
              if [ "$z" != "$canon_zip" ]; then mv "$z" "$canon_zip" || true; fi
            done

            rel="dist-upload/desktop_updater/$plat/release.json"
            if [ -f "$rel" ]; then
              canon_rel="dist-upload/desktop_updater/$plat/novyse-$plat-${{ inputs.version }}-release.json"
              mv "$rel" "$canon_rel"
              echo "Signing $canon_rel"
              dart run desktop_updater release sign --release "$canon_rel" || echo "⚠️ sign failed for $canon_rel"

              echo "Registering $plat in app-archive.json"
              dart run desktop_updater:app_archive upsert \
                --archive "$archive_file" \
                --app-name "Novyse" \
                --version "${{ inputs.version }}" \
                --platform "$plat" \
                --channel stable \
                --release-url "https://github.com/Novyse/novyse/releases/download/v${{ inputs.version }}/novyse-$plat-${{ inputs.version }}-release.json"
            fi
          done

          if [ -f "$archive_file" ]; then
            echo "Signing $archive_file"
            dart run desktop_updater:release sign --app-archive "$archive_file" || echo "⚠️ sign failed for $archive_file"
          fi

          mapfile -t dufiles < <(find dist-upload/desktop_updater -type f | sort)
          if [ "${#dufiles[@]}" -eq 0 ]; then
            echo "No desktop update files."
            exit 0
          fi
          printf '%s\n' "${dufiles[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload "v${{ inputs.version }}" "${dufiles[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS Build (Currently Not Supported for Automated Releases)

  publish-release:
    needs: [build, upload-release, desktop-updater]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append Verification Table & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_NOTES: ${{ inputs.patch_notes }}
        run: |
          mkdir -p release-assets
          gh release download v${{ inputs.version }} --dir release-assets

          # Detect Android public cert fingerprint if present
          ANDROID_FINGERPRINT=""
          if [ -f release-assets/novyse-release-cert.pem ]; then
            ANDROID_FINGERPRINT=$(openssl x509 -in release-assets/novyse-release-cert.pem -noout -fingerprint -sha256 2>/dev/null | cut -d'=' -f2 || true)
          fi

          # Start release notes with original user patch notes
          printf "%s\n\n" "$PATCH_NOTES" > release-notes.md

          # Append verification section
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Integrity Checksums" >> release-notes.md
          echo "" >> release-notes.md
          echo "Below are the SHA-256 checksums to verify the authenticity and integrity of each file." >> release-notes.md
          echo "For detailed verification guides and platform instructions, see [BUILD.md](https://github.com/Novyse/novyse/blob/${{ inputs.release_type }}/BUILD.md#verifying-release-artifacts)." >> release-notes.md

          if [ -n "$ANDROID_FINGERPRINT" ]; then
            echo "" >> release-notes.md
            echo "> **Android Official Signing Certificate SHA-256:** \`$ANDROID_FINGERPRINT\`" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "| Platform | File | SHA-256 Checksum |" >> release-notes.md
          echo "| :--- | :--- | :--- |" >> release-notes.md

          # Append each binary asset to table
          find release-assets -maxdepth 1 -type f ! -name "*.txt" ! -name "*.md" | sort | while read -r filepath; do
            filename=$(basename "$filepath")
            hash=$(sha256sum "$filepath" | awk '{print $1}')

            platform="Other"
            case "$filename" in
              *.apk|*.aab|*.pem) platform="Android" ;;
              *.exe|*.msi) platform="Windows" ;;
              *.deb|*.rpm|*.AppImage|*.snap|*.flatpak|*.tar.gz) platform="Linux" ;;
              *.dmg) platform="macOS" ;;
              *macos*.zip|*mac*.zip) platform="macOS" ;;
              *web*.zip) platform="Web" ;;
            esac

            echo "| **$platform** | \`$filename\` | \`$hash\` |" >> release-notes.md
          done

          # Update release notes and publish release
          gh release edit v${{ inputs.version }} --notes-file release-notes.md --draft=false

  deploy-web:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: build/web/

      - name: Set Cloudflare Project
        id: cf-settings
        run: |
          if [[ "${{ inputs.release_type }}" == "production" ]]; then
            echo "project=novyse-web" >> $GITHUB_OUTPUT
          else
            echo "project=novyse-web-preview" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ steps.cf-settings.outputs.project }} --commit-dirty=true

  publish-flathub:
    needs: publish-release
    runs-on: ubuntu-latest
    if: ${{ inputs.release_type == 'production' }}
    steps:
      - name: Check Flathub Token
        id: check-token
        env:
          FLATHUB_DEPLOY_TOKEN: ${{ secrets.FLATHUB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$FLATHUB_DEPLOY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FLATHUB_DEPLOY_TOKEN secret is not set. Skipping Flathub deployment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_type }}

      - name: Checkout Flathub Repository
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: flathub/com.novyse.novyse
          path: flathub-repo
          token: ${{ secrets.FLATHUB_DEPLOY_TOKEN }}

      - name: Generate Manifest and Copy Metadata
        if: steps.check-token.outputs.skip != 'true'
        run: |
          source scripts/extract-metadata.sh

          TARBALL="${PKG_NAME}-${{ inputs.version }}-linux.tar.gz"
          gh release download v${{ inputs.version }} -p "$TARBALL" || true
          if [ -f "$TARBALL" ]; then
            TARBALL_SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          else
            TARBALL_SHA256=""
          fi
          TARBALL_URL="https://github.com/Novyse/novyse/releases/download/v${{ inputs.version }}/$TARBALL"

          generate_desktop_entry "flathub-repo/${FLATHUB_APP_ID}.desktop" "$FLATHUB_APP_ID"
          generate_appstream_metainfo "flathub-repo/${FLATHUB_APP_ID}.metainfo.xml" "$FLATHUB_APP_ID"
          generate_linux_icons "flathub-repo/icons" "$FLATHUB_APP_ID"
          generate_flathub_manifest "flathub-repo/${FLATHUB_APP_ID}.yml" "$TARBALL_URL" "$TARBALL_SHA256"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push to Flathub
        if: steps.check-token.outputs.skip != 'true'
        run: |
          cd flathub-repo
          git config user.name "GitHub Action Bot"
          git config user.email "bot@novyse.com"
          git add .
          git commit -m "Update to version ${{ inputs.version }}" || exit 0
          git push origin master
