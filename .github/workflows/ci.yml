name: CI (Analyze & Tests)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate OSS Licenses
        run: ./scripts/sync-licenses.sh

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test
