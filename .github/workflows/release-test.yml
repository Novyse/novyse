name: Build Test

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS to build (all or single)
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - linux
          - windows
          - macos
          - web
      ref:
        description: Branch to build
        required: false
        default: development
        type: choice
        options:
          - development
          - production
      upload_all_builds:
        description: Package and upload all build files into a single unified ZIP artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: build-test-${{ inputs.ref }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ inputs.os }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  report:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all dist artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: all-dist
          merge-multiple: true

      - name: List built files
        run: |
          echo "## Built files" >> "$GITHUB_STEP_SUMMARY"
          if [ -d all-dist ]; then
            find all-dist -type f | sort | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            echo "_No artifacts were produced._" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo ""
          echo "Build result: ${{ needs.build.result }}"

      - name: Setup Flutter (desktop-update verify)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify desktop update feed files
        run: |
          echo "## Desktop update feed" >> "$GITHUB_STEP_SUMMARY"
          if [ -d all-dist/desktop_updater ]; then
            find all-dist/desktop_updater -type f | sort | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            echo "_No desktop_updater output (expected on non-production branches)._" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for f in $(find all-dist/desktop_updater -name "release.json" 2>/dev/null); do
            echo "Verifying $f (candidate-only: unsigned package output)" | tee -a "$GITHUB_STEP_SUMMARY"
            dart run desktop_updater verify --release "$f" --candidate-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠️ verify failed for $f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo ""
          echo "SHA-256:" | tee -a "$GITHUB_STEP_SUMMARY"
          find all-dist/desktop_updater -name "*.zip" -exec sha256sum {} \; 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Package all builds into unified ZIP
        if: ${{ inputs.upload_all_builds && always() }}
        run: |
          if [ -d all-dist ] && [ -n "$(ls -A all-dist 2>/dev/null)" ]; then
            mkdir -p bundle
            (cd all-dist && zip -r -q "../bundle/novyse-all-builds-${{ inputs.ref }}.zip" .)
            echo "✅ Created unified zip bundle: novyse-all-builds-${{ inputs.ref }}.zip"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📦 Unified Build Artifact" >> "$GITHUB_STEP_SUMMARY"
            echo "Unified ZIP artifact generated: \`novyse-all-builds-${{ inputs.ref }}.zip\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No artifacts found in all-dist to package." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload unified builds artifact
        if: ${{ inputs.upload_all_builds && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: novyse-all-builds-${{ inputs.ref }}
          path: bundle/
          if-no-files-found: warn
          retention-days: 14
