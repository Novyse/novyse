name: Feature Request
description: Propose a new feature or improvement for the application
title: "[FEATURE] <Brief description>"
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Please describe the proposed feature or improvement.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Description
      description: A clear and concise description of what you want to happen.
      placeholder: e.g., I would like to have a button that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or features you've considered.
      placeholder: e.g., We could alternatively do...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
